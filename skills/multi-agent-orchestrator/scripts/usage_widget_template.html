<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    /* Prevent Antigravity's injected click/key telemetry listener from re-rendering parent with fresh {} cssVariables and resetting iframe srcdoc */
    (function() {
      const origDocAdd = Document.prototype.addEventListener;
      Document.prototype.addEventListener = function(type, fn, opts) {
        if ((type === 'click' || type === 'keydown' || type === 'keyup') && fn && String(fn).indexOf('sendInteraction') !== -1) {
          return;
        }
        return origDocAdd.call(this, type, fn, opts);
      };
    })();
  </script>
  <style>
    /* Non-cyclic semantic variables for both Dark Theme (default) and Light Theme (html.light) */
    html, body {
      --bg: var(--vscode-editor-background, var(--background, #0b111e));
      --panel: var(--vscode-sideBar-background, var(--card, #111827));
      --surface: rgba(148, 163, 184, 0.08);
      --surface-2: rgba(148, 163, 184, 0.16);
      --bdr: var(--border, rgba(148, 163, 184, 0.24));
      --bg-card: var(--panel);
      --text: var(--vscode-editor-foreground, var(--foreground, #ecf2f8));
      --muted: var(--muted-foreground, #94a3b8);
      --blue: #3b82f6;
      --green: #10b981;
      --amber: #f59e0b;
      --red: #f43f5e;
      --claude: #D97757;
      --agy: #818cf8;
      --bolt-cut: #1e293b;
      --shell-bg: linear-gradient(180deg, rgba(30, 41, 59, 0.35) 0%, rgba(15, 23, 42, 0.55) 100%), var(--panel);
      --shell-shadow: 0 4px 14px -4px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }
    html.light, html.light body {
      --bg: var(--vscode-editor-background, var(--background, #f8fafc));
      --panel: var(--vscode-sideBar-background, var(--card, #ffffff));
      --surface: #f1f5f9;
      --surface-2: #e2e8f0;
      --bdr: #cbd5e1;
      --text: var(--vscode-editor-foreground, var(--foreground, #0f172a));
      --muted: var(--muted-foreground, #475569);
      --blue: #2563eb;
      --green: #059669;
      --amber: #d97706;
      --red: #e11d48;
      --claude: #c25938;
      --agy: #4f46e5;
      --bolt-cut: #fef3c7;
      --shell-bg: #ffffff;
      --shell-shadow: 0 2px 10px -2px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html {
      background: var(--bg);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "NanumSquareRound", "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 2px;
      font-size: 12px;
      line-height: 1.35;
      -webkit-font-smoothing: antialiased;
    }

    .widget-shell {
      background: var(--shell-bg);
      border: 1px solid var(--bdr);
      border-radius: 10px;
      padding: 7px 9px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
      box-shadow: var(--shell-shadow);
    }
    body.standalone-web {
      min-height: 100vh;
      padding: 0 12px;
    }
    body.standalone-web .widget-shell {
      max-width: 960px;
      margin: 12px auto;
      padding: 12px;
    }
    .remote-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 9.5px;
      font-weight: 600;
      padding: 1.5px 7px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.11);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.28);
      white-space: nowrap;
    }
    .route-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 9.5px;
      font-weight: 600;
      padding: 1.5px 7px;
      border-radius: 999px;
      background: rgba(16, 185, 129, 0.13);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.32);
      white-space: nowrap;
    }
    .sub-badge {
      display: inline-flex;
      align-items: center;
      gap: 2.5px;
      font-size: 8.5px;
      font-weight: 700;
      padding: 0.5px 5px;
      border-radius: 4px;
      letter-spacing: 0.01em;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .sub-badge.agy {
      background: rgba(129, 140, 248, 0.14);
      color: #a5b4fc;
      border: 1px solid rgba(129, 140, 248, 0.32);
    }
    .sub-badge.direct {
      background: rgba(16, 185, 129, 0.13);
      color: #6ee7b7;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .sub-badge.direct-claude {
      background: rgba(217, 119, 87, 0.14);
      color: #f3a68e;
      border: 1px solid rgba(217, 119, 87, 0.32);
    }
    #view-archive {
      max-height: 175px;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding-right: 2px;
    }

    /* ── 1. AOH QUOTA PANEL (바깥 링: 잔여 한도 / 안쪽 원: 기간 진행 시계 파이) ── */
    .usage-panel {
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-width: 0;
    }
    .usage-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      min-height: 22px;
    }
    .usage-toolbar-left {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    .usage-hint {
      font-size: 10px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .usage-toolbar-btns {
      display: flex;
      align-items: center;
      gap: 4px;
      flex: none;
    }
    .mini-btn {
      height: 22px;
      padding: 0 7px;
      border: 1px solid var(--bdr);
      background: var(--surface);
      color: var(--text);
      border-radius: 5px;
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }
    .mini-btn:hover { background: var(--surface-2); }

    .usage-panel-body {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      min-width: 0;
      width: 100%;
    }
    @media (max-width: 480px) {
      .usage-panel-body {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    fieldset.usage-account {
      min-width: 0;
      min-inline-size: 0;
      margin: 0;
      border: 1px solid var(--bdr);
      border-radius: 7px;
      padding: 4px 4px 5px;
      background: var(--surface);
      grid-column: span 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    fieldset.usage-account[data-provider="antigravity"] { --accent: #60a5fa; border-color: rgba(96, 165, 250, 0.45); }
    fieldset.usage-account[data-provider="codex"] { --accent: var(--green); border-color: rgba(16, 185, 129, 0.45); }
    fieldset.usage-account[data-provider="claude"] { --accent: #df934a; border-color: rgba(223, 147, 74, 0.45); }

    legend.usage-account-heading {
      width: auto;
      max-width: 100%;
      padding: 0 4px;
      margin: 0 auto 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-size: 10px;
      line-height: 1.2;
      white-space: nowrap;
    }
    legend.usage-account-heading > strong {
      color: var(--accent, var(--text));
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .usage-account-windows {
      display: grid;
      grid-template-columns: repeat(var(--cols, 1), minmax(0, 1fr));
      gap: 2px;
      min-width: 0;
    }
    .usage-window {
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
      text-align: center;
    }
    .usage-gauge-button {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1px;
      border: 0;
      background: transparent;
      color: var(--text);
      border-radius: 5px;
      cursor: pointer;
    }
    .usage-gauge-button:hover { background: var(--surface-2); }

    .usage-donut {
      position: relative;
      width: 52px;
      height: 52px;
      flex: none;
      color: var(--muted);
    }
    .usage-donut.unused { color: var(--blue); }
    .usage-donut.in-use { color: var(--green); }
    .usage-donut.exhausted { color: var(--red); }
    .usage-donut > svg {
      width: 100%;
      height: 100%;
      stroke-width: 5;
      stroke-linecap: butt;
      fill: none;
    }
    .usage-ring-track { stroke: var(--bdr); }
    .usage-ring-remaining { stroke: currentColor; }
    .usage-donut.exhausted .usage-ring-track { stroke: var(--red); stroke-width: 2.2; }
    .usage-clock-background { fill: #7397c2; fill-opacity: 0.18; stroke: none; }
    .usage-clock-fill { fill: #436f9f; fill-opacity: 0.85; stroke: none; }

    .usage-donut-center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5px;
      pointer-events: none;
      color: var(--text);
    }
    .usage-donut-center > strong {
      font-size: 10px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: -0.4px;
      font-variant-numeric: tabular-nums;
    }
    .usage-donut-center > .usage-center-caption {
      font-size: 6.5px;
      line-height: 1.05;
      color: var(--muted);
    }
    .usage-center-period {
      display: inline-block;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 7.5px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.2px;
    }
    .usage-center-period.p-5h { color: #38bdf8; }
    .usage-center-period.p-7d { color: #a78bfa; }
    html.light .usage-center-period.p-5h { color: #0284c7; }
    html.light .usage-center-period.p-7d { color: #6d28d9; }

    .compact-pool-lead { display: none; }

    .acc-head-ico, .acc-inline-ico {
      flex: none;
      display: inline-block;
      vertical-align: middle;
    }
    fieldset.usage-account[data-provider="codex"] .acc-head-ico,
    fieldset.usage-account[data-provider="codex"] .acc-inline-ico {
      color: var(--green);
    }

    .win-model-icons {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 1px;
      line-height: 1;
    }
    .win-ico {
      flex: none;
      display: inline-block;
    }
    .win-ico.codex-tint {
      color: var(--green);
    }
    .ico-pipe {
      display: inline-block;
      width: 1px;
      height: 8.5px;
      background: rgba(148, 163, 184, 0.55);
      margin: 0 0.5px;
      flex: none;
    }
    html.light .ico-pipe {
      background: rgba(100, 116, 139, 0.45);
    }

    /* Flat inline row under each donut gauge — ONLY tight model icon(s) */
    .usage-window-title {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 2px;
      padding: 0;
      background: transparent;
      border: 0;
      line-height: 1;
      white-space: nowrap;
      max-width: 100%;
    }

    .usage-quota-state {
      font-size: 8.5px;
      line-height: 1.15;
      font-weight: 500;
    }
    .usage-quota-state.unused { color: var(--blue); }
    .usage-quota-state.in-use { color: var(--green); }
    .usage-quota-state.exhausted { color: var(--red); }

    .usage-reset {
      font-size: 8.5px;
      line-height: 1.2;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    /* ── AOH COMPACT DENSITY MODE (Ultra-slim 1-line docked top bar, zero overlap, zero scrollbar) ── */
    .usage-panel[data-density="compact"] {
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      padding: 2px 5px;
      background: var(--surface);
      border: 1px solid var(--bdr);
      border-radius: 7px;
      min-height: 26px;
      overflow: hidden;
    }
    .usage-panel[data-density="compact"] .usage-toolbar {
      order: 2;
      min-height: 20px;
      gap: 3px;
      flex: none;
    }
    .usage-panel[data-density="compact"] #density-btn {
      height: 20px;
      padding: 0 5px;
      font-size: 9px;
    }
    .usage-panel[data-density="compact"] .usage-hint,
    .usage-panel[data-density="compact"] .remote-pill,
    .usage-panel[data-density="compact"] .route-pill { display: none !important; }
    .usage-panel[data-density="compact"] .usage-panel-body {
      order: 1;
      display: flex !important;
      flex-direction: row !important;
      align-items: center !important;
      justify-content: flex-start;
      gap: 4px;
      flex: 1;
      min-width: 0;
      overflow: hidden !important;
      padding: 0;
    }
    .usage-panel[data-density="compact"] fieldset.usage-account {
      flex-direction: row !important;
      align-items: center !important;
      justify-content: flex-start !important;
      gap: 4px !important;
      padding: 1px 5px !important;
      min-height: 20px !important;
      height: 20px !important;
      border-radius: 4px;
      flex: 0 0 auto !important;
      min-width: max-content !important;
      width: auto !important;
      overflow: hidden;
    }
    /* When Claude has both 5h and 7d windows in compact mode, show only the 7d window to save horizontal space */
    .usage-panel[data-density="compact"] fieldset.usage-account[data-provider="claude"] .usage-window:first-child:not(:last-child) {
      display: none !important;
    }
    .usage-panel[data-density="compact"] legend.usage-account-heading { display: none !important; }
    .usage-provider-inline {
      display: none;
      font-size: 8.5px;
      font-weight: 800;
      color: var(--accent, var(--text));
      white-space: nowrap;
      align-items: center;
      gap: 2px;
    }
    .usage-panel[data-density="compact"] .usage-provider-inline { display: inline-flex !important; }
    .usage-panel[data-density="compact"] .compact-pool-lead {
      display: inline-flex !important;
      align-items: center;
      justify-content: center;
      margin-right: 1px;
    }
    .usage-panel[data-density="compact"] .compact-pool-lead.pool-sep {
      margin-left: 3px;
      padding-left: 4px;
      border-left: 1px solid var(--bdr);
    }
    .usage-panel[data-density="compact"] .usage-account-windows {
      display: inline-flex !important;
      flex-direction: row !important;
      align-items: center !important;
      gap: 5px !important;
      width: auto !important;
      flex: none !important;
    }
    .usage-panel[data-density="compact"] .usage-window {
      flex-direction: row !important;
      align-items: center !important;
      gap: 2px !important;
    }
    .usage-panel[data-density="compact"] .usage-gauge-button {
      flex-direction: row !important;
      align-items: center !important;
      gap: 2.5px !important;
      padding: 0 !important;
    }
    .usage-panel[data-density="compact"] .usage-window-title,
    .usage-panel[data-density="compact"] .usage-quota-state,
    .usage-panel[data-density="compact"] .usage-reset,
    .usage-panel[data-density="compact"] .usage-center-caption { display: none !important; }
    .usage-panel[data-density="compact"] .usage-donut {
      width: auto !important;
      height: 16px !important;
      display: inline-flex !important;
      flex-direction: row !important;
      align-items: center !important;
      gap: 2.5px !important;
      position: static !important;
    }
    .usage-panel[data-density="compact"] .usage-donut > svg {
      width: 13px !important;
      height: 13px !important;
      stroke-width: 7 !important;
      position: static !important;
      flex: none;
    }
    .usage-panel[data-density="compact"] .usage-donut-center {
      position: static !important;
      inset: auto !important;
      display: inline-flex !important;
      flex-direction: row !important;
      align-items: baseline !important;
      gap: 2px !important;
    }
    .usage-panel[data-density="compact"] .usage-donut-center > strong {
      font-size: 9px !important;
      line-height: 1 !important;
      font-weight: 700 !important;
    }
    .usage-panel[data-density="compact"] .usage-center-period {
      display: inline !important;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 8px !important;
      line-height: 1 !important;
      font-weight: 700 !important;
      padding: 0 !important;
      background: transparent !important;
    }
    .usage-panel[data-density="compact"] .usage-center-period.p-5h { color: #38bdf8 !important; }
    .usage-panel[data-density="compact"] .usage-center-period.p-7d { color: #a78bfa !important; }
    html.light .usage-panel[data-density="compact"] .usage-center-period.p-5h { color: #0284c7 !important; }
    html.light .usage-panel[data-density="compact"] .usage-center-period.p-7d { color: #6d28d9 !important; }

    /* ── 2. NARROW-SAFE AGENT EXECUTION TREE ── */
    .tree-section {
      border: 1px solid var(--bdr);
      border-radius: 7px;
      padding: 6px 7px;
      background: var(--surface);
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }
    .tree-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding-bottom: 4px;
      border-bottom: 1px solid var(--bdr);
      font-size: 11px;
      font-weight: 700;
    }
    .tree-header-title {
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .agent-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      min-height: 22px;
      padding: 2px 5px;
      border-radius: 5px;
      cursor: pointer;
      min-width: 0;
      transition: background 0.12s, box-shadow 0.15s;
    }
    .agent-row:hover { background: var(--surface-2); }
    .agent-row.parent {
      background: linear-gradient(90deg, rgba(59, 130, 246, 0.065) 0%, rgba(99, 102, 241, 0.035) 100%);
      box-shadow: inset 2px 0 0 rgba(96, 165, 250, 0.65);
    }
    .agent-row.parent:hover {
      background: linear-gradient(90deg, rgba(59, 130, 246, 0.11) 0%, rgba(99, 102, 241, 0.06) 100%);
      box-shadow: inset 2px 0 0 rgba(125, 211, 252, 0.9);
    }
    .agent-row.child {
      background: rgba(128, 145, 175, 0.025);
      box-shadow: none !important;
    }

    .agent-left {
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
      flex: 1;
    }
    /* Hierarchy decoration must never consume a row column. */
    .tree-branch-char { display: none; }
    .tree-children {
      margin: 0 !important;
      padding: 0 !important;
      border: 0 !important;
      background: rgba(128, 145, 175, 0.02);
    }
    .provider-icon {
      width: 12px;
      height: 12px;
      flex: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    @keyframes dotBreathBlue {
      0%, 100% { background: #3b82f6; box-shadow: 0 0 1px rgba(59, 130, 246, 0.18); transform: scale(0.98); opacity: 0.52; }
      50% { background: #60a5fa; box-shadow: 0 0 4px rgba(96, 165, 250, 0.38); transform: scale(1.03); opacity: 0.85; }
    }
    @keyframes dotBreathGreen {
      0%, 100% { background: #10b981; box-shadow: 0 0 1px rgba(16, 185, 129, 0.14); transform: scale(0.98); opacity: 0.48; }
      50% { background: #34d399; box-shadow: 0 0 3.5px rgba(52, 211, 153, 0.32); transform: scale(1.03); opacity: 0.80; }
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      flex: none;
      transition: background-color 1.2s ease, box-shadow 1.2s ease, opacity 1.2s ease;
    }
    .status-dot.busy {
      background: #3b82f6;
      animation: dotBreathBlue 2.0s ease-in-out infinite;
    }
    .status-dot.idle-fresh, .status-dot.running {
      background: #10b981;
      animation: dotBreathGreen 3.0s ease-in-out infinite;
    }
    /* 브리딩 종료 후 경과 시간에 따라 익어가는 단계별 상태불 (초록 → 노랑 → 주황 → 빨강) */
    .status-dot.age-green {
      background: #10b981;
      box-shadow: none;
      opacity: 0.86;
    }
    .status-dot.age-yellow, .status-dot.idle {
      background: #facc15;
      box-shadow: 0 0 4px rgba(250, 204, 21, 0.28);
    }
    .status-dot.age-orange {
      background: #fb923c;
      box-shadow: 0 0 4px rgba(251, 146, 60, 0.28);
    }
    .status-dot.age-red, .status-dot.done {
      background: #f87171;
      box-shadow: 0 0 4px rgba(248, 113, 113, 0.28);
    }

    .agent-name {
      font-size: 11px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }
    .agent-row.child .agent-name { font-weight: 500; }

    .agent-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: none;
    }
    .model-pill {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 9.5px;
      padding: 1.5px 6px;
      border-radius: 4px;
      border: 1px solid var(--bdr);
      background: rgba(15, 23, 42, 0.35);
      white-space: nowrap;
      display: inline-flex;
      align-items: center;

    /* Pure SVG Lightning Speed Badges (1x Bolt = Fast, 3x Overlapping Bolts = Ultra Fast) */

    .open-btn {

    .tab-badge {

    .icon-btn {

    .cmd-box {
      display: flex;

    .pin-tag {

    /* ── 3. BOTTOM MCP & WORKER STRIP ── */

      border-color: #cbd5e1;
    }
    .pc-bento-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      font-size: 9.5px;
      font-weight: 700;
    }
    .pc-bento-title {
      color: #cbd5e1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    html.light .pc-bento-title { color: #334155; }
    .pc-bento-badge {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 8.8px;
      padding: 0.5px 4.5px;
      border-radius: 4px;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .pc-bento-badge.ok { background: rgba(84, 201, 160, 0.14); color: #54c9a0; }
    .pc-bento-badge.warn { background: rgba(233, 180, 91, 0.16); color: #e9b45b; }
    .pc-bento-badge.crit { background: rgba(239, 122, 133, 0.18); color: #ef7a85; }
    html.light .pc-bento-badge.ok { background: rgba(5, 150, 105, 0.12); color: #047857; }
    .pc-bento-meter {
      width: 100%;
      height: 4px;
      border-radius: 99px;
      background: rgba(148, 163, 184, 0.16);
      overflow: hidden;
    }
    .pc-bento-fill { display: block; height: 100%; border-radius: 99px; transition: width 0.3s ease; }
    .pc-bento-sub {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 3px 6px;
      font-size: 8.8px;
      color: #94a3b8;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-variant-numeric: tabular-nums;
    }
    .pc-bento-sub b { color: #e2e8f0; font-weight: 600; }
    html.light .pc-bento-sub { color: #64748b; }
    html.light .pc-bento-sub b { color: #0f172a; }
    .pc-proj-list {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      margin-top: 2px;
      width: 100%;
    }
    .pc-proj-pill {
      font-size: 8.2px;
      padding: 1px 4.5px;
      border-radius: 3px;
      background: rgba(99, 102, 241, 0.10);
      border: 1px solid rgba(129, 140, 248, 0.22);
      color: #a5b4fc;
    }
    html.light .pc-proj-pill {
      background: rgba(79, 70, 229, 0.08);
      border-color: rgba(79, 70, 229, 0.24);
      color: #4338ca;
    }
  
    .ctx-vbar {
      width: 4px; height: 12px; border-radius: 2px;
      background: rgba(148, 163, 184, 0.22);
      display: inline-flex; align-items: flex-end; overflow: hidden; flex: none;
    }
    .ctx-vbar .ctx-vbar-fill { width: 100%; border-radius: 2px; }
    .ctx-vbar .ctx-vbar-fill.ok { background: #54c9a0; }
    .ctx-vbar .ctx-vbar-fill.warn { background: #e9b45b; }
    .ctx-vbar .ctx-vbar-fill.crit { background: #ef7a85; }
    .ctx-repeat-ico { width: 11px; height: 11px; flex: none; color: #54c9a0; opacity: 0.95; }
    html.light .ctx-repeat-ico { color: #059669; }
    .agent-row .ctx-pill {
      background: transparent !important; border: none !important; padding: 0 2px !important;
    }
    .ctx-pill.running {
      border-color: rgba(84, 201, 160, 0.32);
      background: rgba(84, 201, 160, 0.08);
      color: #6ee7b7;
    }
    .ctx-pill.done {
      color: #94a3b8;
    }
    html.light .ctx-pill.running {
      border-color: rgba(5, 150, 105, 0.35);
      background: rgba(5, 150, 105, 0.08);
      color: #047857;
    }
    html.light .ctx-pill.done { color: #64748b; }
    /* Row state colors now live on the ctx-pill text (status dots were removed from tree rows). */
    .ctx-pill.busy .ctx-time-txt, .ctx-pill.running .ctx-time-txt, .ctx-pill.st-busy .ctx-time-txt { color: #60a5fa; font-weight: 700; }
    .ctx-pill.idle-fresh .ctx-time-txt, .ctx-pill.age-green .ctx-time-txt { color: #54c9a0; font-weight: 600; }
    .ctx-pill.age-yellow .ctx-time-txt { color: #e9b45b; font-weight: 600; }
    .ctx-pill.age-orange .ctx-time-txt { color: #f59e0b; font-weight: 600; }
    .ctx-pill.age-red .ctx-time-txt, .ctx-pill.done .ctx-time-txt { color: #94a3b8; font-weight: 500; }
    html.light .ctx-pill.busy .ctx-time-txt, html.light .ctx-pill.running .ctx-time-txt { color: #2563eb; }
    html.light .ctx-pill.idle-fresh .ctx-time-txt, html.light .ctx-pill.age-green .ctx-time-txt { color: #059669; }
    html.light .ctx-pill.age-yellow .ctx-time-txt { color: #d97706; }
    html.light .ctx-pill.age-orange .ctx-time-txt { color: #ea580c; }
    html.light .ctx-pill.age-red .ctx-time-txt, html.light .ctx-pill.done .ctx-time-txt { color: #64748b; }
    .ctx-time-txt {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 9px;
      letter-spacing: -0.02em;
      transition: color 1.2s ease;
    }
  </style>

    /* Safe storage wrapper so sandboxed <agent-embed> iframes NEVER throw SecurityError */
    const memStore = {};
    function safeGet(key, fallback) {
      try {
        const v = window.localStorage ? window.localStorage.getItem(key) : null;
        return v !== null ? v : (memStore[key] ?? fallback);
      } catch (_) {
        return memStore[key] ?? fallback;
      }
    }
    function safeSet(key, val) {
      memStore[key] = val;
      try {
        if (window.localStorage) window.localStorage.setItem(key, val);
      } catch (_) {}
    }

    function clockPath(progress) {
      if (progress === null || progress <= 0) return '';
      if (progress >= 1) return 'M32 10 A22 22 0 1 1 32 54 A22 22 0 1 1 32 10 Z';
      const angle = 2 * Math.PI * progress;
      const x = (32 + 22 * Math.sin(angle)).toFixed(2);
      const y = (32 - 22 * Math.cos(angle)).toFixed(2);
      return `M32 32 L32 10 A22 22 0 ${progress > 0.5 ? 1 : 0} 1 ${x} ${y} Z`;
    }

    function timeProgress(w) {
      if (!w.windowMinutes || !w.resetsAt) return null;
      const nowSec = Date.now() / 1000;
      return Math.max(0, Math.min(1, 1 - (w.resetsAt - nowSec) / (w.windowMinutes * 60)));
    }

    function quotaState(rem) {
      if (rem >= 100) return { id: 'unused', label: '미사용' };
      if (rem <= 0) return { id: 'exhausted', label: '소진 · 리셋 대기' };
      return { id: 'in-use', label: '사용중' };
    }

    function compactRemaining(resetsAt, fallback) {
      if (!resetsAt) return fallback || '-';
      const sec = Math.ceil(resetsAt - Date.now() / 1000);
      if (sec <= 0) return '곧 리셋';
      const d = Math.floor(sec / 86400);
      const h = Math.floor((sec % 86400) / 3600);
      const m = Math.floor((sec % 3600) / 60);
      if (d > 0) return `${d}d ${h}h`;
      if (h > 0) return `${h}h ${m}m`;
      return `${m}m`;
    }

    function fmtPct(val) {
      if (val === undefined || val === null) return '-';
      const n = Number(val);
      if (n >= 100) return '100%';
      if (n <= 0) return '0%';
      return `${Math.min(Math.floor(n * 10) / 10, 99.9).toFixed(1)}%`;
    }

    function updateRouteBadges() {
      const agy = ACCOUNTS.find(a => a.provider === 'antigravity');
      const cdx = ACCOUNTS.find(a => a.provider === 'codex');
      const cld = ACCOUNTS.find(a => a.provider === 'claude');
      const findW = (acc, key, period) => (acc && acc.windows)
        ? (acc.windows.find(w => w.poolKey === key) || acc.windows.find(w => w.periodKind === period))
        : null;

      const gem5h = findW(agy, 'agy_gemini_5h', '5h');
      const gem7d = findW(agy, 'agy_gemini_7d', '7d');
      const clAg5h = findW(agy, 'agy_claude_5h', '5h');
      const clAg7d = findW(agy, 'agy_claude_7d', '7d');
      const cdx7d = findW(cdx, 'codex_7d', '7d') || (cdx && cdx.windows ? cdx.windows[0] : null);
      const cld5h = findW(cld, 'claude_5h', '5h');
      const cld7d = findW(cld, 'claude_7d', '7d');

      function evalPool(id, name, shortName, fhW, wkW, pref) {
        const fh = fhW ? Number(fhW.remaining || 0) : null;
        const wk = wkW ? Number(wkW.remaining || 0) : null;
        if ((fh !== null && fh <= 0) || (wk !== null && wk <= 0)) {
          return { id, name, shortName, fh, wk, score: 0, mode: 'exhausted', tag: `${shortName}(소진 차단)`, pref };
        }
        if (wk !== null && wk <= 2) {
          const base = fh !== null ? fh : wk;
          return { id, name, shortName, fh, wk, score: Math.min(base, wk * 0.3), mode: 'reserve_hold', tag: `${shortName}(7d ${fmtPct(wk)} 비상보존)`, pref };
        }
        if (wk !== null && wk <= 10) {
          const score = fh !== null ? Math.min(fh, wk * 2.5) : wk;
          return { id, name, shortName, fh, wk, score, mode: 'weekly_conserve', tag: `${shortName}(5h ${fmtPct(fh)}·7d ${fmtPct(wk)} 절약)`, pref };
        }
        let score = 0;
        if (fh !== null && wk !== null) {
          score = Math.round((0.25 * fh + 0.75 * Math.min(fh, wk)) * 10) / 10;
        } else if (fh !== null) {
          score = fh;
        } else if (wk !== null) {
          score = wk;
        }
        const winLbl = (fh !== null && wk !== null) ? `5h ${fmtPct(fh)}·7d ${fmtPct(wk)}` : (fh !== null ? `5h ${fmtPct(fh)}` : `7d ${fmtPct(wk)}`);
        return { id, name, shortName, fh, wk, score, mode: 'normal', tag: `${shortName}(${winLbl})`, pref };
      }

      const pCodex = evalPool('dot-codex-pool', 'Codex 6.1-sol Fast', 'Codex 6.1-sol', null, cdx7d, 3);
      const pOpus = evalPool('dot-agy-claude', 'AGY Opus 5.5', 'AGY Opus 5.5', clAg5h, clAg7d, 2);
      const pArgon = evalPool('dot-agy-gemini', 'AGY 4 Argon', 'AGY 4 Argon', gem5h, gem7d, 1);
      const pClaude = evalPool('dot-claude-direct', 'Claude Team Opus', 'Claude Team', cld5h, cld7d, 0);
      const pools = [pCodex, pOpus, pArgon, pClaude];

      for (const p of pools) {
        const dotEl = document.getElementById(p.id);
        if (dotEl) {
          if (p.mode === 'exhausted') {
            dotEl.style.background = 'var(--red)';
            dotEl.title = `${p.name}: 한도 0% 소진 (자동 페일오버 스티어링 동작 중)`;
          } else if (p.mode === 'reserve_hold' || p.mode === 'weekly_conserve') {
            dotEl.style.background = 'var(--amber)';
            dotEl.title = `${p.name}: ${p.tag}`;
          } else {
            dotEl.style.background = 'var(--green)';
            dotEl.title = `${p.name}: 정상 가동 (${p.tag})`;
          }
        }
      }

      pools.sort((a, b) => (b.score - a.score) || (b.pref - a.pref));
      const avail = pools.filter(p => p.score > 0);
      const top2 = avail.slice(0, 2).map(p => p.tag).join(' · ') || '가용 풀 없음';
      const fullSummary = pools.map((p, i) => `${p.score > 0 ? `${i + 1}순위` : '제외'} ${p.tag}`).join(' | ');

      const badge = document.getElementById('auto-route-badge');
      const badgeTxt = document.getElementById('auto-route-text');
      if (badge) {
        badge.title = `실시간 3단계 주간 보호 + 한도 0% 자동 페일오버 스티어링 (7d>10% 정상 / 7d≤10% 주간절약 우회 / 7d≤2% 비상보존 / 0% 차단 및 자동 스티어링):\n${fullSummary}`;
      }
      if (badgeTxt) {
        badgeTxt.textContent = `자동배분: ${top2}`;
      }
      const detRoute = document.getElementById('det-agy-main-route');
      if (detRoute) {
        detRoute.textContent = `자동 라우팅: ${fullSummary}`;
      }
    }

    function renderModelIcons(icons, size) {
      const list = Array.isArray(icons) && icons.length ? icons : ['#ico-gemini'];
      if (list.length === 1) {
        const ico = list[0];
        const cls = ico.includes('codex') ? 'win-ico codex-tint' : 'win-ico';
        return `<span class="win-model-icons"><svg class="${cls}" width="${size}" height="${size}"><use href="${ico}"/></svg></span>`;
      }
      const parts = list.map((ico, i) => {
        const cls = ico.includes('codex') ? 'win-ico codex-tint' : 'win-ico';
        const svg = `<svg class="${cls}" width="${size}" height="${size}"><use href="${ico}"/></svg>`;
        return i > 0 ? `<span class="ico-pipe" aria-hidden="true"></span>${svg}` : svg;
      });
      return `<span class="win-model-icons dual">${parts.join('')}</span>`;
    }

    /*__POOL_CAPACITIES_JSON_START__*/
    const POOL_TOKEN_CAPACITIES = {
      agy_gemini_5h: 193000000,
      agy_gemini_7d: 621000000,
      agy_claude_5h: 2120000,
      agy_claude_7d: 3940000,

    function formatTokenKorean(tokens) {
      if (!tokens || isNaN(tokens) || tokens <= 0) return '0';
      if (tokens >= 100000000) {
        const uk = Math.floor(tokens / 100000000);
        const remMan = Math.round((tokens % 100000000) / 10000);
        return remMan > 0 ? `${uk}억 ${remMan.toLocaleString()}만` : `${uk}억`;
      } else if (tokens >= 10000) {
        const man = Math.round(tokens / 10000);
        return `${man.toLocaleString()}만`;
      }
      return tokens.toLocaleString();
    }

    let lastQuotasSig = '';
    function renderQuotas(force = false) {
      const grid = document.getElementById('quota-grid');
      if (!grid) return;
      const sig = JSON.stringify(ACCOUNTS);
      if (!force && sig === lastQuotasSig && grid.querySelector('.usage-account')) {
        updateRouteBadges();
        return;
      }
      lastQuotasSig = sig;
      grid.innerHTML = '';
      const sorted = [...ACCOUNTS].sort((a, b) => {
        const maxA = Math.max(0, ...(a.windows || []).map(w => w.remaining || 0));
        const maxB = Math.max(0, ...(b.windows || []).map(w => w.remaining || 0));
        const activeA = maxA > 0 ? 1 : 0;
        const activeB = maxB > 0 ? 1 : 0;
        return activeB - activeA;
      });
      const totalCols = sorted.reduce((sum, acc) => sum + Math.max(1, (acc.windows || []).length), 0) || 5;
      grid.style.setProperty('--total-cols', String(totalCols));
      sorted.forEach(acc => {
        const wins = acc.windows || [];
        const span = Math.max(1, wins.length);
        const prov = acc.provider || '';
        const accIco = acc.accountIcon || (prov === 'antigravity' ? '#ico-agy-logo' : `#ico-${prov}`);
        const fs = document.createElement('fieldset');
        fs.className = 'usage-account';
        fs.dataset.provider = prov;
        fs.style.setProperty('--span', '1');
        fs.style.setProperty('--cols', span);

        const legend = document.createElement('legend');
        legend.className = 'usage-account-heading';
        legend.title = acc.name || '';
        legend.innerHTML = `<svg class="acc-head-ico" width="13" height="13"><use href="${accIco}"/></svg><strong>${acc.short || acc.name}</strong>`;
        fs.appendChild(legend);

        const inlineHead = document.createElement('span');
        inlineHead.className = 'usage-provider-inline';
        inlineHead.title = acc.name || '';
        inlineHead.innerHTML = `<svg class="acc-inline-ico" width="13" height="13"><use href="${accIco}"/></svg>`;
        fs.appendChild(inlineHead);

        const winWrap = document.createElement('div');
        winWrap.className = 'usage-account-windows';

        wins.forEach((w, idx) => {
          const st = quotaState(w.remaining);
          const prog = timeProgress(w);
          const pathD = clockPath(prog);
          const dispPct = fmtPct(w.remaining);
          const remCountdown = compactRemaining(w.resetsAt, w.resetText);
          const totalTok = w.totalTokens || POOL_TOKEN_CAPACITIES[w.poolKey] || null;
          let tokenLine = '';
          if (totalTok && w.remaining !== null && w.remaining !== undefined) {
            const remTokens = Math.round(totalTok * (w.remaining / 100.0));
            tokenLine = `\n토큰 용량: 잔여 약 ${formatTokenKorean(remTokens)} / 총 ${formatTokenKorean(totalTok)} 토큰`;
          }
          const tip = `${acc.name} · ${w.label}\n바깥 링: 남음 ${dispPct} (${st.label})\n안쪽 시계원: ${prog === null ? '리셋 대기중' : `기간 ${Math.round(prog * 100)}% 경과`}\n리셋: ${remCountdown} (${w.resetText} KST)${tokenLine}`;
          const mIcons = Array.isArray(w.modelIcons) && w.modelIcons.length ? w.modelIcons : [w.modelIcon || accIco];
          const pKind = w.periodKind || (String(w.shortPeriod || '').includes('5h') ? '5h' : '7d');
          const shortP = w.shortPeriod || pKind;
          const prevMIcons = idx > 0 ? (Array.isArray(wins[idx - 1].modelIcons) ? wins[idx - 1].modelIcons : [wins[idx - 1].modelIcon]) : null;
          const showCompactPool = (prov === 'antigravity') && (idx === 0 || JSON.stringify(prevMIcons) !== JSON.stringify(mIcons));
          const compactPoolHtml = showCompactPool
            ? `<span class="compact-pool-lead${idx > 0 ? ' pool-sep' : ''}" title="${(w.label || '').replace(/"/g, '&quot;')}">${renderModelIcons(mIcons, 10)}</span>`
            : '';

          const winEl = document.createElement('div');
          winEl.className = `usage-window ${st.id}`;
          winEl.innerHTML = `
            <button type="button" class="usage-gauge-button" data-tip="${tip.replace(/"/g, '&quot;')}" title="${tip.replace(/"/g, '&quot;')}">
              ${compactPoolHtml}
              <div class="usage-donut ${st.id}">
                <svg viewBox="0 0 64 64" aria-hidden="true">
                  <circle cx="32" cy="32" r="22" class="usage-clock-background"></circle>
                  <path class="usage-clock-fill" d="${pathD}"></path>
                  <circle cx="32" cy="32" r="27" pathLength="100" class="usage-ring-track"></circle>
                  <circle cx="32" cy="32" r="27" pathLength="100" class="usage-ring-remaining" stroke-dasharray="${w.remaining} 100" transform="rotate(-90 32 32)"></circle>
                </svg>
                <div class="usage-donut-center">
                  <strong>${dispPct}</strong>
                  <small class="usage-center-caption">남음</small>
                  <small class="usage-center-period p-${pKind}">${shortP}</small>
                </div>
              </div>
            </button>
            <span class="usage-window-title" title="${(w.label || '').replace(/"/g, '&quot;')}">
              ${renderModelIcons(mIcons, 11)}
            </span>
            <span class="usage-quota-state ${st.id}">${st.label}</span>
            <span class="usage-reset">${remCountdown}</span>
          `;
          const btn = winEl.querySelector('.usage-gauge-button');
          btn.addEventListener('mouseenter', e => showTip(e.currentTarget));
          btn.addEventListener('mouseleave', hideTip);
          btn.addEventListener('click', e => { e.stopPropagation(); showTip(e.currentTarget); });
          winWrap.appendChild(winEl);
        });

        fs.appendChild(winWrap);
        grid.appendChild(fs);
      });
      updateRouteBadges();
    }

    const tooltip = document.getElementById('usage-tooltip');
    function showTip(anchor) {
      tooltip.textContent = anchor.dataset.tip || '';
      tooltip.classList.remove('hidden');
      const r = anchor.getBoundingClientRect();
      const left = Math.max(6, Math.min(window.innerWidth - 260, r.left + r.width / 2 - 120));
      const top = r.bottom + 6;
      tooltip.style.left = `${left}px`;
      tooltip.style.top = `${top}px`;
    }
    function hideTip() { tooltip.classList.add('hidden'); }
    document.addEventListener('click', hideTip);

    function applyDensityState() {
      const panel = document.getElementById('usage-panel');
      const btn = document.getElementById('density-btn');
      if (panel) panel.dataset.density = currentDensity;
      if (btn) btn.textContent = currentDensity === 'compact' ? '확장 ▾' : '컴팩트 ▴';

      currentDensity = currentDensity === 'compact' ? 'expanded' : 'compact';

      document.querySelectorAll('.tree-children, [id^="br-"]').forEach(el => {
        el.classList.toggle('hidden', allCollapsed);
      });
      document.querySelectorAll('.agent-detail[id]').forEach(el => {
        el.classList.toggle('open', openDetails.has(el.id));

      const btn = document.getElementById('btn-toggle-all');
      if (btn) btn.textContent = allCollapsed ? '↕ 하위 트리 전체 펴기' : '↕ 하위 트리 전체 접기';
      const bgBtn = document.getElementById('btn-toggle-bg-daemons');
      if (bgBtn) bgBtn.textContent = showBgDaemons ? '⚙ 상시 데몬·타이머 표시: 켜짐' : '⚙ 상시 데몬·타이머 표시: 꺼짐';

      showBgDaemons = !showBgDaemons;
      document.querySelectorAll('[id^="br-"]').forEach(br => {
        delete br.dataset.daemonsState;
      });
      applyTreeUiState();
      applyTreeFilters();
      saveState();
      showToast(showBgDaemons ? '⚙ 상시 데몬·타이머 트리 표시: 켜짐' : '⚙ 상시 데몬·타이머 트리 표시: 꺼짐 (아이콘 클릭 시 개별 펼침)');
      notifyParentResize();

    function toggleNodeDaemons(branchId, btn) {
      const br = document.getElementById(branchId);
      if (!br) return;
      const curOpen = br.dataset.daemonsState ? (br.dataset.daemonsState === 'open') : showBgDaemons;
      const nextOpen = !curOpen && !br.classList.contains('hidden') ? false : (!curOpen || br.classList.contains('hidden'));
      br.dataset.daemonsState = nextOpen ? 'open' : 'closed';
      if (nextOpen) {
        br.classList.remove('hidden');
      }
      applyTreeFilters();
      notifyParentResize();
    }

    function toggleDetail(id) {
      const el = document.getElementById(id);
      if (!el) return;
      if (openDetails.has(id)) openDetails.delete(id);
      else openDetails.add(id);
      applyTreeUiState();
      saveState();
      notifyParentResize();
    }

    const liveLogTimers = {};
    async function fetchLiveLogOnce(provider, sessionId, boxEl) {
      try {
        const r = await fetch(`${BRIDGE_URL}/api/logs/tail?provider=${encodeURIComponent(provider)}&id=${encodeURIComponent(sessionId)}&lines=20`);
        const j = await r.json();
        if (j && j.ok && Array.isArray(j.lines)) {
          boxEl.textContent = j.lines.length ? j.lines.join('\n') : '(최근 출력 로그 없음)';
          boxEl.scrollTop = boxEl.scrollHeight;
        }
      } catch (_) {
        boxEl.textContent = '브리지 서버(127.0.0.1:18765)에서 로그를 불러올 수 없습니다.';
      }
      notifyParentResize();
    }

    function toggleLiveLog(provider, sessionId, boxId, btn) {
      const box = document.getElementById(boxId);
      if (!box) return;
      const isHidden = box.classList.contains('hidden');
      if (!isHidden) {
        box.classList.add('hidden');
        if (btn) btn.textContent = '실시간 로그 ▾';
        if (liveLogTimers[boxId]) {
          clearInterval(liveLogTimers[boxId]);
          delete liveLogTimers[boxId];
        }
        notifyParentResize();
        return;
      }
      box.classList.remove('hidden');
      if (btn) btn.textContent = '실시간 로그 ▴';
      fetchLiveLogOnce(provider, sessionId, box);
      if (liveLogTimers[boxId]) clearInterval(liveLogTimers[boxId]);
      liveLogTimers[boxId] = setInterval(() => {
        if (!document.body.contains(box) || box.classList.contains('hidden')) {
          clearInterval(liveLogTimers[boxId]);
          delete liveLogTimers[boxId];
          return;
        }
        fetchLiveLogOnce(provider, sessionId, box);
      }, 3000);
    }

    /* ── WORKTREE STATE MANAGEMENT (SAFE IN SANDBOXED IFRAME + SERVER_STATE SYNCED!) ── */
    const STORAGE_DISMISSED = 'agy_dismissed_nodes_v1';
    const STORAGE_PINNED = 'agy_pinned_nodes_v1';

    function updateLastRefreshBadge(tsMs) {
      const d = new Date(tsMs || Date.now());
      const pad = n => String(n).padStart(2, '0');
      const hh = pad(d.getHours());
      const mm = pad(d.getMinutes());
      const ss = pad(d.getSeconds());
      const timeStr = `${hh}:${mm}:${ss}`;
      const yyyy = d.getFullYear();
      const mo = pad(d.getMonth() + 1);
      const dd = pad(d.getDate());
      const fullStr = `${yyyy}-${mo}-${dd} ${timeStr}`;
      const el = document.getElementById('last-refresh-ts');
      if (el) {
        el.textContent = `↻ ${timeStr}`;
        el.title = `마지막 동기화: ${fullStr}`;
      }
    }

    function storedIdList(key, fallback) {
      let ids = fallback;
      try {
        const raw = safeGet(key, null);
        if (raw !== null) ids = JSON.parse(raw);
      } catch (_) {}
      if (!Array.isArray(ids)) ids = Array.isArray(fallback) ? fallback : [];
      return ids.filter(id => typeof id === 'string');
    }

    const initDismissed = [
      ...(Array.isArray(SERVER_STATE.dismissed) ? SERVER_STATE.dismissed : []),
      ...JSON.parse(safeGet(STORAGE_DISMISSED, '[]'))
    ];
    let dismissedSet = new Set(initDismissed);
    let pinnedSet = new Set([
      ...(Array.isArray(SERVER_STATE.pinned) ? SERVER_STATE.pinned : []),
      ...storedIdList(STORAGE_PINNED, [])
    ]);
    let importedSet = new Set([
      ...(Array.isArray(SERVER_STATE.imported) ? SERVER_STATE.imported : []),
      ...JSON.parse(safeGet(STORAGE_IMPORTED, '[]'))
    ]);
    let importedCascades = (SERVER_STATE.importedCascades && typeof SERVER_STATE.importedCascades === 'object')
      ? { ...SERVER_STATE.importedCascades }
      : {};
    let currentScope = safeGet(STORAGE_SCOPE, SERVER_STATE.scope || 'current');
    let currentTab = safeGet(STORAGE_TAB, SERVER_STATE.tab || 'active');
    let closedDays = Number(safeGet(STORAGE_CLOSED_DAYS, String(SERVER_STATE.closedDays || 7))) === 30 ? 30 : 7;
    let statusFilter = safeGet(STORAGE_STATUS_FILTER, SERVER_STATE.statusFilter || 'all');
    let currentDensity = safeGet(STORAGE_DENSITY, SERVER_STATE.density || 'compact') === 'expanded' ? 'expanded' : 'compact';
    let allCollapsed = safeGet(STORAGE_ALL_COLLAPSED, String(SERVER_STATE.allCollapsed === true)) === 'true';
    let showBgDaemons = safeGet(STORAGE_SHOW_BG_DAEMONS, String(SERVER_STATE.showBgDaemons !== false)) !== 'false';
    const openDetails = new Set(storedIdList(STORAGE_OPEN_DETAILS, SERVER_STATE.openDetails));
    let userTouchedState = false;
    let userTouchedTab = false;
    let lastDismissedId = null;
    let lastDismissedBatch = [];
    let toastTimer = null;

    const BRIDGE_URL = (location.protocol.startsWith('http') && location.host)
      ? location.origin : 'http://127.0.0.1:18765';
    if (window.parent === window) {
      document.body.classList.add('standalone-web');
      document.title = 'AI Usage & Multi-Agent Orchestrator';
    }

    function syncAgentCustomFromBridge(state) {
      if (!state || typeof state !== 'object') return;
      if (Array.isArray(state.dismissed)) dismissedSet = new Set([...dismissedSet, ...state.dismissed]);
      if (Array.isArray(state.pinned)) pinnedSet = new Set([...pinnedSet, ...state.pinned]);
      if (Array.isArray(state.imported)) importedSet = new Set([...importedSet, ...state.imported]);
      if (state.importedCascades && typeof state.importedCascades === 'object') {
        importedCascades = { ...importedCascades, ...state.importedCascades };
      }
      if (state.closedDays) {
        closedDays = Number(state.closedDays) === 30 ? 30 : 7;
        safeSet(STORAGE_CLOSED_DAYS, String(closedDays));
      }
      if (state.scope && ['current', 'all'].includes(state.scope)) {
        currentScope = state.scope;
        safeSet(STORAGE_SCOPE, currentScope);
      }
      if (state.statusFilter) {
        statusFilter = state.statusFilter;
        safeSet(STORAGE_STATUS_FILTER, statusFilter);
      }
      if (!userTouchedTab && state.tab && ['active', 'closed'].includes(state.tab)) {
        currentTab = state.tab;
        safeSet(STORAGE_TAB, currentTab);
      }
      if (safeGet(STORAGE_DENSITY, null) === null && ['compact', 'expanded'].includes(state.density)) {
        currentDensity = state.density;
      }
      if (safeGet(STORAGE_ALL_COLLAPSED, null) === null && typeof state.allCollapsed === 'boolean') {
        allCollapsed = state.allCollapsed;
      }
      if (safeGet(STORAGE_SHOW_BG_DAEMONS, null) === null && typeof state.showBgDaemons === 'boolean') {
        showBgDaemons = state.showBgDaemons;
      }
      if (safeGet(STORAGE_OPEN_DETAILS, null) === null && Array.isArray(state.openDetails)) {
        openDetails.clear();
        state.openDetails.filter(id => typeof id === 'string').forEach(id => openDetails.add(id));
      }
    }

    function saveCustomState(extraBody = {}) {
      saveState(extraBody);
    }

    function saveState(extraBody = {}) {
      userTouchedState = true;
      safeSet(STORAGE_DISMISSED, JSON.stringify([...dismissedSet]));
      safeSet(STORAGE_PINNED, JSON.stringify([...pinnedSet]));
      safeSet(STORAGE_IMPORTED, JSON.stringify([...importedSet]));
      safeSet(STORAGE_SCOPE, currentScope);
      safeSet(STORAGE_TAB, currentTab);
      safeSet(STORAGE_CLOSED_DAYS, String(closedDays));
      safeSet(STORAGE_STATUS_FILTER, statusFilter);
      safeSet(STORAGE_DENSITY, currentDensity);
      safeSet(STORAGE_ALL_COLLAPSED, String(allCollapsed));
      safeSet(STORAGE_SHOW_BG_DAEMONS, String(showBgDaemons));
      safeSet(STORAGE_OPEN_DETAILS, JSON.stringify([...openDetails]));
      const payload = {
        dismissed: [...dismissedSet],
        pinned: [...pinnedSet],
        imported: [...importedSet],
        scope: currentScope,
        tab: currentTab,
        closedDays: closedDays,
        statusFilter: statusFilter,
        density: currentDensity,
        allCollapsed: allCollapsed,
        showBgDaemons: showBgDaemons,
        openDetails: [...openDetails],
        ...extraBody
      };
      fetch(`${BRIDGE_URL}/api/state`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      }).catch(() => {});
      fetch(`${BRIDGE_URL}/api/widget-state`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      }).catch(() => {});
    }

    function showToast(msg, allowUndo = false) {
      const bar = document.getElementById('toast-bar');
      const msgEl = document.getElementById('toast-msg');
      const undoBtn = document.getElementById('toast-undo-btn');
      if (!bar || !msgEl) return;
      msgEl.textContent = msg;
      if (undoBtn) undoBtn.classList.toggle('hidden', !allowUndo);
      bar.classList.remove('hidden');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { bar.classList.add('hidden'); }, 3800);

    async function openSession(e, nodeId, cid, label, repo) {
      if (e) {
        e.stopPropagation();
        e.preventDefault();
      }
      const safeLabel = label || nodeId || '세션';
      if (cid) {
        copyText(`conversation://${cid}`);
      } else if (nodeId) {
        copyText(nodeId);
      }
      showToast(`'${safeLabel}' 창으로 전환 요청 중...`);

      try {
        const r = await fetch(`${BRIDGE_URL}/api/open-session`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nodeId, cascadeId: cid, label: safeLabel, repo: repo || '' })
        });
        const j = await r.json();
        if (j && j.ok) {
          showToast(`✓ Antigravity 창으로 전환되었습니다 ('${safeLabel}')`);
        } else {
          showToast(`✓ 세션 정보 복사 완료 ('${safeLabel}')`);
        }
      } catch (_) {
        showToast(`✓ 세션 정보 복사 완료 ('${safeLabel}')`);
      }
    }

    function markImportedButton(node) {
      const id = node.dataset.nodeId;
      const btn = node.querySelector(':scope > .agent-row .import-btn');
      const cid = importedCascades[id];
      const nameEl = node.querySelector(':scope > .agent-row .agent-name');
      const label = nameEl ? nameEl.textContent.trim() : id;
      const repoEl = node.querySelector(':scope > .agent-row .repo-tag');
      const repo = repoEl ? repoEl.textContent.trim() : '';

      if (btn) {
        if (cid) {
          const openBtn = document.createElement('button');
          openBtn.type = 'button';
          openBtn.className = 'icon-act-btn open';
          openBtn.innerHTML = '<svg width="12" height="12" aria-hidden="true"><use href="#ico-open-ext"/></svg>';
          openBtn.title = '왼쪽 사이드바(dev)로 가져온 대화창 열기 (Antigravity 전환)';
          openBtn.setAttribute('aria-label', openBtn.title);
          openBtn.onclick = (e) => openSession(e, id, cid, label, repo);
          btn.replaceWith(openBtn);
        } else {
          btn.textContent = '✓';
          btn.title = '현재 범위 및 왼쪽 사이드바(dev)에 고정됨';
          btn.setAttribute('aria-label', btn.title);
        }
      }
    }

    function pinImportedNodes() {
      document.querySelectorAll('.tree-node').forEach(node => {
        const id = node.dataset.nodeId;
        const isPin = pinnedSet.has(id) || node.dataset.pinned === '1';
        node.classList.toggle('pinned', isPin);
        if (isPin) node.dataset.pinned = '1';
        else delete node.dataset.pinned;
        const pBtn = node.querySelector(':scope > .agent-row .pin-btn');
        if (pBtn) pBtn.classList.toggle('active', isPin);
      });
      const view = document.getElementById('view-active');
      if (!view) return;
      [...importedSet].forEach(id => {
        if (dismissedSet.has(id) && !pinnedSet.has(id)) return;
        const node = document.querySelector(`#view-active .tree-node[data-node-id="${CSS.escape(id)}"]`);
        if (!node) return;
        node.dataset.scope = 'current';
        node.classList.add('imported');
        markImportedButton(node);
      });
    }

    function applyTreeFilters() {
      let activeRootCount = 0;
      let closedCount = 0;

      // 1. Active View (#view-active > .tree-node)
      document.querySelectorAll('#view-active > .tree-node').forEach(node => {
        const id = node.dataset.nodeId;
        const isPin = pinnedSet.has(id) || node.dataset.pinned === '1';
        if (!isPin && dismissedSet.has(id)) {
          node.classList.add('hidden');
          return;
        }
        const inScope = currentScope === 'all' || node.dataset.scope === 'current' || importedSet.has(id) || isPin;
        node.classList.toggle('hidden', !inScope);
        if (inScope) activeRootCount++;
      });

      // Child nodes inside #view-active
      document.querySelectorAll('#view-active .tree-node .tree-node').forEach(node => {
        const isDaemonNode = node.classList.contains('bg-daemon-node');
        const br = node.parentElement;
        const brDaemonOpen = br && br.dataset.daemonsState
          ? (br.dataset.daemonsState === 'open')
          : showBgDaemons;
        const hide = dismissedSet.has(node.dataset.nodeId) || (isDaemonNode && !brDaemonOpen);
        node.classList.toggle('hidden', hide);
      });

      // Sync .bg-daemon-chip active state on each parent row
      document.querySelectorAll('#view-active > .tree-node').forEach(parentNode => {
        const chip = parentNode.querySelector(':scope > .agent-row .bg-daemon-chip');
        const br = parentNode.querySelector(':scope > .tree-children[id^="br-"]');
        if (chip && br) {
          const isOpen = !br.classList.contains('hidden') && (br.dataset.daemonsState ? br.dataset.daemonsState === 'open' : showBgDaemons);
          chip.classList.toggle('active', isOpen);
        }
      });

      // Keep tree branch connectors (├─ / └─) clean for visible children in each group
      document.querySelectorAll('[id^="br-"]').forEach(container => {
        const vis = [...container.querySelectorAll(':scope > .tree-node:not(.hidden)')].filter(n => n.querySelector('.tree-branch-char, .tree-elbow'));
        vis.forEach((n, idx) => {
          const ch = n.querySelector('.tree-branch-char, .tree-elbow');
          if (ch) ch.textContent = (idx === vis.length - 1) ? '└─' : '├─';
        });
      });

      // 2. Closed Sessions View (#view-closed > .tree-node) filtered by 7d / 30d, scope, and not dismissed
      document.querySelectorAll('#view-closed > .tree-node').forEach(node => {
        const id = node.dataset.nodeId;
        const isPin = pinnedSet.has(id) || node.dataset.pinned === '1';
        if (!isPin && dismissedSet.has(id)) {
          node.classList.add('hidden');
          return;
        }
        const age = Number(node.dataset.ageDays || 0);
        const inDays = age <= closedDays || isPin;
        const inScope = currentScope === 'all' || node.dataset.scope === 'current' || isPin;
        const show = inDays && inScope;
        node.classList.toggle('hidden', !show);
        if (show) closedCount++;
      });

      const bAct = document.getElementById('badge-active-cnt');
      if (bAct) bAct.textContent = activeRootCount;
      const bCls = document.getElementById('badge-closed-cnt');
      if (bCls) bCls.textContent = closedCount;

      const sCur = document.getElementById('scope-current');
      const sAll = document.getElementById('scope-all');
      if (sCur) sCur.classList.toggle('active', currentScope === 'current');
      if (sAll) sAll.classList.toggle('active', currentScope === 'all');

      const c7 = document.getElementById('closed-7d');
      const c30 = document.getElementById('closed-30d');
      if (c7) c7.classList.toggle('active', closedDays === 7);
      if (c30) c30.classList.toggle('active', closedDays === 30);

      const cLbl = document.getElementById('closed-summary-label');
      if (cLbl) {
        cLbl.textContent = `최근 ${closedDays}일 이내 작업 후 완료·닫은 세션 (${closedCount}개)`;
      }
    }

      const pop = document.getElementById('settings-menu-popover');
      if (!pop) return;
      pop.classList.toggle('hidden');
      notifyParentResize();

    function closeSettingsMenu() {
      const pop = document.getElementById('settings-menu-popover');
      if (pop && !pop.classList.contains('hidden')) {
        pop.classList.add('hidden');
        notifyParentResize();

    function switchTab(tab, fromUser = true) {
      if (fromUser) userTouchedTab = true;
      currentTab = (tab === 'closed') ? 'closed' : 'active';
      const tAct = document.getElementById('tab-active');
      const tCls = document.getElementById('tab-closed');
      const vAct = document.getElementById('view-active');
      const vCls = document.getElementById('view-closed');
      const cDaysGrp = document.getElementById('closed-days-group');
      if (tAct) tAct.classList.toggle('active', currentTab === 'active');
      if (tCls) tCls.classList.toggle('active', currentTab === 'closed');
      if (vAct) vAct.classList.toggle('hidden', currentTab !== 'active');
      if (vCls) vCls.classList.toggle('hidden', currentTab !== 'closed');
      if (cDaysGrp) cDaysGrp.classList.toggle('hidden', currentTab !== 'closed');
      applyTreeFilters();
      if (fromUser) saveState();
      notifyParentResize();
    }

    function setClosedDays(days) {
      closedDays = (Number(days) === 30) ? 30 : 7;
      if (currentTab !== 'closed') {
        switchTab('closed', true);
      } else {
        applyTreeFilters();
        saveState();
        notifyParentResize();
      }
      showToast(`닫은·완료 세션 필터: 최근 ${closedDays}일 이내`);
    }

    function togglePin(nodeId, label, btn) {
      const node = document.querySelector(`.tree-node[data-node-id="${CSS.escape(nodeId)}"]`);
      if (pinnedSet.has(nodeId)) {
        pinnedSet.delete(nodeId);
        if (node) {
          node.classList.remove('pinned');
          delete node.dataset.pinned;
        }
        if (btn) btn.classList.remove('active');
        saveState();
        applyTreeFilters();
        showToast(`고정 해제됨: '${label}'`);
      } else {
        pinnedSet.add(nodeId);
        dismissedSet.delete(nodeId);
        if (node) {
          node.classList.add('pinned');
          node.dataset.pinned = '1';
          if (node.parentElement && node.parentElement.id === 'view-closed') {
            const va = document.getElementById('view-active');
            if (va) va.appendChild(node);
          }
        }
        if (btn) btn.classList.add('active');
        saveState({ removeDismissed: [nodeId] });
        applyTreeFilters();
        showToast(`📌 '${label}' 고정됨 (완료 정리 시에도 지워지지 않습니다)`);
      }
      notifyParentResize();
    }

    function clearCompletedKeepPinned() {
      const batch = [];
      let pinnedKept = 0;
      document.querySelectorAll('#view-active > .tree-node, #view-closed > .tree-node').forEach(node => {
        const id = node.dataset.nodeId;
        if (!id || dismissedSet.has(id)) return;
        const isPin = pinnedSet.has(id) || node.dataset.pinned === '1' || node.classList.contains('pinned');
        if (isPin) {
          pinnedKept++;
          return;
        }
        const isRunning = node.dataset.running === '1' || Boolean(node.querySelector(':scope > .agent-row .status-dot.busy, :scope > .agent-row .status-dot.idle-fresh, :scope > .agent-row .status-dot.running, :scope > .agent-row .ctx-pill.busy, :scope > .agent-row .ctx-pill.idle-fresh, :scope > .agent-row .ctx-pill.running, :scope > .agent-row .ctx-pill.st-busy'));
        if (isRunning && node.parentElement && node.parentElement.id === 'view-active') {
          return;
        }
        dismissedSet.add(id);
        batch.push(id);
      });
      if (!batch.length) {
        showToast(`정리할 완료 세션이 없습니다 (📌 고정 ${pinnedKept}개 · 🟢 작업중 유지)`);
        return;
      }
      lastDismissedBatch = batch;
      lastDismissedId = batch[0];
      saveState({ addDismissed: batch });
      batch.forEach(id => {
        const el = document.querySelector(`.tree-node[data-node-id="${CSS.escape(id)}"]`);
        if (el && !el.classList.contains('hidden') && el.dataset.exiting !== '1') {
          el.dataset.exiting = '1';
          el.classList.add('node-exit', 'sub-evaporating');
        }
      });
      setTimeout(() => {
        applyTreeFilters();
        notifyParentResize();
      }, 320);
      showToast(`🧹 완료된 세션 ${batch.length}개 정리됨 (📌 핀 고정 ${pinnedKept}개 · 🟢 작업중 유지)`, true);
    }

    async function importRunningSessions() {
      showToast('📥 현재 돌아가고 있는 세션을 스캔하여 가져오는 중...');
      try {
        const r = await fetch(`${BRIDGE_URL}/api/refresh?scope=all`);
        const j = await r.json();
        if (j && j.ok) {
          if (Array.isArray(j.accounts)) ACCOUNTS.splice(0, ACCOUNTS.length, ...j.accounts);
          if (j.activeTreeHtml) {
            const va = document.getElementById('view-active');
            if (va) va.innerHTML = j.activeTreeHtml;
          }
          if (j.closedTreeHtml) {
            const vc = document.getElementById('view-closed');
            if (vc) vc.innerHTML = j.closedTreeHtml;
          }
        }
      } catch (_) {}

      let importedCount = 0;
      const runningNodes = [...document.querySelectorAll('#view-active > .tree-node')].filter(node => {
        return node.dataset.running === '1' || Boolean(node.querySelector(':scope > .agent-row .status-dot.busy, :scope > .agent-row .status-dot.running, :scope > .agent-row .ctx-pill.busy, :scope > .agent-row .ctx-pill.running, :scope > .agent-row .ctx-pill.st-busy'));
      });
      for (const node of runningNodes) {
        const id = node.dataset.nodeId;
        if (!id) continue;
        dismissedSet.delete(id);
        const isExternal = node.dataset.scope !== 'current' || id.startsWith('node-cdx-') || id.startsWith('node-claude-');
        if (isExternal) {
          importedSet.add(id);
          importedCount++;
        }
        node.dataset.scope = 'current';
        const impBtn = node.querySelector(':scope > .agent-row .import-btn');
        if (impBtn && !importedCascades[id]) {
          const onclickAttr = impBtn.getAttribute('onclick') || '';
          const m = onclickAttr.match(/codex resume [0-9a-f-]+/i);
          if (m) {
            const nameEl = node.querySelector(':scope > .agent-row .agent-name');
            const label = nameEl ? nameEl.textContent.trim() : id;
            fetch(`${BRIDGE_URL}/api/import`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ nodeId: id, cmdText: m[0], label })
            }).then(res => res.json()).then(ij => {
              if (ij && ij.ok && ij.cascadeId) {
                importedCascades[id] = ij.cascadeId;
                markImportedButton(node);
              }
            }).catch(() => {});
          }
        }
      }
      saveState({ removeDismissed: runningNodes.map(n => n.dataset.nodeId).filter(Boolean) });
      renderQuotas();
      applyDensityState();
      pinImportedNodes();
      applyTreeUiState();
      switchTab('active', false);
      showToast(`✓ 현재 돌아가고 있는 세션 ${importedCount}개를 작업 트리로 가져왔습니다.`);
      notifyParentResize();
    }

    function dismissNode(nodeId, label) {
      if (pinnedSet.has(nodeId)) {
        pinnedSet.delete(nodeId);
      }
      dismissedSet.add(nodeId);
      lastDismissedId = nodeId;
      lastDismissedBatch = [nodeId];
      saveState({ addDismissed: [nodeId] });
      const targetEl = document.querySelector(`.tree-node[data-node-id="${CSS.escape(nodeId)}"]`);
      if (targetEl && !targetEl.classList.contains('hidden') && targetEl.dataset.exiting !== '1') {
        targetEl.dataset.exiting = '1';
        targetEl.classList.add('node-exit', 'sub-evaporating');
        setTimeout(() => {
          applyTreeFilters();
          notifyParentResize();
        }, 320);
      } else {
        applyTreeFilters();
        notifyParentResize();
      }
      showToast(`'${label}' 목록에서 숨김 처리됨`, true);
    }

    function restoreClosedSession(nodeId, label) {
      dismissedSet.delete(nodeId);
      saveState({ removeDismissed: [nodeId] });
      applyTreeFilters();
      showToast(`'${label}' 세션을 복원했습니다.`);
      notifyParentResize();
    }

    function undoLastDismiss() {
      const batch = (Array.isArray(lastDismissedBatch) && lastDismissedBatch.length)
        ? lastDismissedBatch
        : (lastDismissedId ? [lastDismissedId] : []);
      if (!batch.length) return;
      batch.forEach(id => dismissedSet.delete(id));
      lastDismissedId = null;
      lastDismissedBatch = [];
      saveState({ removeDismissed: batch });
      applyTreeFilters();
      document.getElementById('toast-bar').classList.add('hidden');
      notifyParentResize();
    }

    /* ── DIRECT CODEX COMMAND BAR ([+ Codex 직접 명령] / [명령 ▶] / [터미널 ↗]) ── */
    let activeCodexThreadId = '';
    let activeCodexCwd = '/home/u24c9g5090r64/dev';

    function updateCodexPopoverSpace() {

    /* Sandbox-safe copy */
    function copyText(text) {
      let ok = false;
      const active = document.activeElement;
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;padding:0;border:0;opacity:0;';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try { ta.setSelectionRange(0, text.length); } catch (_) {}
      try { ok = document.execCommand('copy'); } catch (_) { ok = false; }
      ta.remove();
      if (active && active.focus) { try { active.focus({ preventScroll: true }); } catch (_) {} }
      if (!ok) {
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).catch(() => {});
        } catch (_) {}
      }
      return ok;
    }

      label.classList.toggle('ok', !!copied);
      box.classList.remove('hidden');
      try { input.focus({ preventScroll: true }); } catch (_) { input.focus(); }
      input.select();
      try { input.setSelectionRange(0, text.length); } catch (_) {}
      notifyParentResize();
    }
