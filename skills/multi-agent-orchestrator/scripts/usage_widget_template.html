    function normalizeTreeSig(html) {
      return String(html || '')
        .replace(/<!--__[A-Z_]+__-->/g, '')
        .replace(/data-sub-age="\d+"/g, '')
        .replace(/data-idle-age="\d+"/g, '')
        .replace(/<span class="ctx-time-txt"[^>]*>[\s\S]*?<\/span>/g, '')
        .replace(/title="[^"]*후 증발\)"/g, '')
        .replace(/status-dot age-(?:green|yellow|orange|red)/g, 'status-dot age-any')
        .replace(/ctx-pill age-(?:green|yellow|orange|red)/g, 'ctx-pill age-any')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function smartPatchTree(container, newHtml) {
      if (!container || !newHtml) return false;
      const prevSig = container.dataset.treeSig || normalizeTreeSig(container.innerHTML);
      const nextSig = normalizeTreeSig(newHtml);
      if (prevSig === nextSig && container.children.length > 0) {
        container.dataset.treeSig = nextSig;
        return false;
      }
      const subAges = {};
      container.querySelectorAll('.tree-node.sub-ripening[data-node-id]').forEach(n => {
        if (n.dataset.subAge) subAges[n.dataset.nodeId] = n.dataset.subAge;
      });
      const daemonStates = {};
      container.querySelectorAll('[id^="br-"]').forEach(br => {
        if (br.dataset.daemonsState) daemonStates[br.id] = br.dataset.daemonsState;
      });

      const temp = document.createElement('div');
      temp.innerHTML = newHtml;

      if (container.children.length === 0) {
        temp.querySelectorAll(':scope > .tree-node').forEach(node => {
          node.classList.add('node-enter');
        });
        container.innerHTML = temp.innerHTML;
        container.dataset.treeSig = nextSig;
        return true;
      }

      const existingMap = new Map();
      container.querySelectorAll(':scope > .tree-node').forEach(node => {
        const id = node.dataset.nodeId;
        if (id) existingMap.set(id, node);
      });
      const nextNodes = Array.from(temp.querySelectorAll(':scope > .tree-node'));
      const nextMap = new Map();
      nextNodes.forEach(node => {
        const id = node.dataset.nodeId;
        if (id) nextMap.set(id, node);
      });

      // 1. Vanished nodes: exit animation + data-exiting
      existingMap.forEach((oldNode, id) => {
        if (!nextMap.has(id)) {
          if (oldNode.dataset.exiting !== '1') {
            oldNode.dataset.exiting = '1';
            oldNode.classList.add('node-exit', 'sub-evaporating');
            setTimeout(() => {
              oldNode.remove();
              applyTreeFilters();
              notifyParentResize();
            }, 320);
          }
        }
      });

      // 2. Insert new nodes or reconcile existing nodes
      nextNodes.forEach(newNode => {
        const id = newNode.dataset.nodeId;
        const existingNode = id ? existingMap.get(id) : null;
        if (!existingNode) {
          newNode.classList.add('node-enter');
          container.appendChild(newNode);
        } else {
          if (existingNode.dataset.exiting === '1') {
            delete existingNode.dataset.exiting;
            existingNode.classList.remove('node-exit', 'sub-evaporating');
          }
          const oldBr = existingNode.querySelector(':scope > .tree-children[id^="br-"]');
          const newBr = newNode.querySelector(':scope > .tree-children[id^="br-"]');
          if (oldBr && newBr) {
            reconcileBranchChildren(oldBr, newBr);
          }
          const oldRow = existingNode.querySelector(':scope > .agent-row');
          const newRow = newNode.querySelector(':scope > .agent-row');
          const pRunningChanged = (existingNode.dataset.running || '0') !== (newNode.dataset.running || '0');
          if (oldRow && newRow) {
            if (pRunningChanged) {
              oldRow.innerHTML = newRow.innerHTML;
            } else {
              patchAgentRowInPlace(oldRow, newRow, false);
            }
          }
          const oldDet = existingNode.querySelector(':scope > .agent-detail');
          const newDet = newNode.querySelector(':scope > .agent-detail');
          if (oldDet && newDet && oldDet.innerHTML !== newDet.innerHTML) {
            oldDet.innerHTML = newDet.innerHTML;
          }
          if (newNode.dataset.subAge !== undefined) existingNode.dataset.subAge = newNode.dataset.subAge;
          if (newNode.dataset.subRunning !== undefined) existingNode.dataset.subRunning = newNode.dataset.subRunning;
          if (newNode.dataset.running !== undefined) existingNode.dataset.running = newNode.dataset.running;
          if (newNode.dataset.scope !== undefined) existingNode.dataset.scope = newNode.dataset.scope;
        }
      });

      container.dataset.treeSig = nextSig;
      Object.entries(subAges).forEach(([id, age]) => {
        const el = container.querySelector(`.tree-node.sub-ripening[data-node-id="${CSS.escape(id)}"]`);
        if (el && el.dataset.subRunning !== '1') el.dataset.subAge = age;
      });
      Object.entries(daemonStates).forEach(([brId, st]) => {
        const br = container.querySelector(`#${CSS.escape(brId)}`);
        if (br) br.dataset.daemonsState = st;
      });
      return true;
    }

    function patchAgentRowInPlace(oldRow, newRow, isSub) {
      if (!oldRow || !newRow) return;

      const oName = oldRow.querySelector('.agent-name');
      const nName = newRow.querySelector('.agent-name');
      if (oName && nName && oName.textContent !== nName.textContent) {
        oName.textContent = nName.textContent;
      }

      const oPill = oldRow.querySelector('.model-pill');
      const nPill = newRow.querySelector('.model-pill');
      if (oPill && nPill && (oPill.className !== nPill.className || oPill.innerHTML !== nPill.innerHTML)) {
        oPill.className = nPill.className;
        oPill.innerHTML = nPill.innerHTML;
        oPill.title = nPill.title;
      }

      const oDot = oldRow.querySelector('.status-dot');
      const nDot = newRow.querySelector('.status-dot');
      if (oDot && nDot) {
        if (isSub) {
          if (nDot.classList.contains('busy')) {
            if (!oDot.classList.contains('busy')) {
              oDot.className = nDot.className;
              oDot.title = nDot.title;
            }
          } else {
            if (oDot.classList.contains('busy')) {
              oDot.className = 'status-dot idle-fresh';
            }
            // Non-running subagent: tickSubRipening is the SOLE owner of ripening classes!
          }
        } else {
          if (oDot.className !== nDot.className) oDot.className = nDot.className;
          if (oDot.title !== nDot.title) oDot.title = nDot.title;
        }
      }

      const oCtx = oldRow.querySelector('.ctx-pill');
      const nCtx = newRow.querySelector('.ctx-pill');
      if (oCtx && nCtx) {
        if (isSub) {
          if (nCtx.classList.contains('busy')) {
            if (!oCtx.classList.contains('busy')) oCtx.className = nCtx.className;
          } else {
            if (oCtx.classList.contains('busy')) oCtx.className = 'ctx-pill idle-fresh';
            // Non-running subagent: tickSubRipening is the SOLE owner of ripening classes!
          }
        } else {
          if (oCtx.className !== nCtx.className) oCtx.className = nCtx.className;
          if (oCtx.title !== nCtx.title) oCtx.title = nCtx.title;
        }
        const oVFill = oCtx.querySelector('.ctx-vbar-fill');
        const nVFill = nCtx.querySelector('.ctx-vbar-fill');
        if (oVFill && nVFill) {
          if (oVFill.className !== nVFill.className) oVFill.className = nVFill.className;
          if (oVFill.style.height !== nVFill.style.height) oVFill.style.height = nVFill.style.height;
        }
        const oTime = oCtx.querySelector('.ctx-time-txt');
        const nTime = nCtx.querySelector('.ctx-time-txt');
        if (oTime && nTime) {
          if (nTime.dataset.startTs) oTime.dataset.startTs = nTime.dataset.startTs;
          if (nTime.dataset.durLabel) oTime.dataset.durLabel = nTime.dataset.durLabel;
          if (nTime.dataset.clockLabel) oTime.dataset.clockLabel = nTime.dataset.clockLabel;
        }
      }

      const oAct = oldRow.querySelector('.row-actions');
      const nAct = newRow.querySelector('.row-actions');
      if (oAct && nAct && oAct.innerHTML !== nAct.innerHTML) {
        oAct.innerHTML = nAct.innerHTML;
      }
    }

    function reconcileBranchChildren(oldBr, newBr) {
      const oldChildren = new Map();
      oldBr.querySelectorAll(':scope > .tree-node').forEach(n => {
        if (n.dataset.nodeId) oldChildren.set(n.dataset.nodeId, n);
      });
      const newChildren = Array.from(newBr.querySelectorAll(':scope > .tree-node'));
      const newMap = new Map();
      newChildren.forEach(n => {
        if (n.dataset.nodeId) newMap.set(n.dataset.nodeId, n);
      });

      oldChildren.forEach((child, id) => {
        if (!newMap.has(id)) {
          if (child.dataset.exiting !== '1') {
            child.dataset.exiting = '1';
            child.classList.add('node-exit', 'sub-evaporating');
            setTimeout(() => {
              child.remove();
              applyTreeFilters();
              notifyParentResize();
            }, 320);
          }
        }
      });

      newChildren.forEach(newChild => {
        const nid = newChild.getAttribute('data-node-id') || newChild.dataset.nodeId;
        const isRunning = newChild.getAttribute('data-sub-running') === '1' || newChild.dataset.subRunning === '1';
        if (isRunning && nid) {
          evaporatedSubIds.delete(nid);
        }
        const oldChild = nid ? oldChildren.get(nid) : null;
        if (!oldChild) {
          if (!isRunning && nid && evaporatedSubIds.has(nid)) {
            // SKIP appending it so it NEVER resurrects on subsequent 4s polls!
            return;
          }
          newChild.classList.add('node-enter');
          oldBr.appendChild(newChild);
        } else {
          if (oldChild.dataset.exiting === '1') {
            delete oldChild.dataset.exiting;
            oldChild.classList.remove('node-exit', 'sub-evaporating');
          }
          const oRow = oldChild.querySelector(':scope > .agent-row');
          const nRow = newChild.querySelector(':scope > .agent-row');
          const runningChanged = (oldChild.dataset.subRunning || '0') !== (newChild.dataset.subRunning || '0');
          if (oRow && nRow) {
            if (runningChanged) {
              oRow.innerHTML = nRow.innerHTML;
            } else {
              patchAgentRowInPlace(oRow, nRow, true);
            }
          }
          if (newChild.dataset.subAge !== undefined) {
            if (newChild.dataset.subRunning === '1') {
              oldChild.dataset.subAge = '0';
            } else {
              const sAge = Number(newChild.dataset.subAge || 0);
              const cAge = Number(oldChild.dataset.subAge || 0);
              if (Math.abs(sAge - cAge) > 4) {
                oldChild.dataset.subAge = String(sAge);
              }
            }
          }
          if (newChild.dataset.subRunning !== undefined) oldChild.dataset.subRunning = newChild.dataset.subRunning;
          if (newChild.getAttribute('data-idle-age') !== null) {
            oldChild.setAttribute('data-idle-age', newChild.getAttribute('data-idle-age'));
          }
        }
      });

      // Re-order oldBr children to match exact order of newChildren only if position changed
      let targetIdx = 0;
      newChildren.forEach(nc => {
        const nid = nc.getAttribute('data-node-id') || nc.dataset.nodeId;
        if (!nid) return;
        const oc = oldBr.querySelector(`:scope > [data-node-id="${nid}"]`);
        if (!oc) return;
        if (oldBr.children[targetIdx] !== oc) {
          oldBr.insertBefore(oc, oldBr.children[targetIdx] || null);
        }
        targetIdx++;
      });

      // Update .tree-branch text (├─ for non-last, └─ for last visible child)
      const visibleChildren = Array.from(oldBr.querySelectorAll(':scope > .tree-node')).filter(c => c.dataset.exiting !== '1' && c.style.display !== 'none');
      visibleChildren.forEach((child, idx) => {
        const branchEl = child.querySelector(':scope > .agent-row .tree-branch');
        if (branchEl) {
          const isLast = (idx === visibleChildren.length - 1);
          branchEl.textContent = isLast ? '└─ ' : '├─ ';
        }
      });
    }

    const STORAGE_PC_MON_OPEN = 'agy_widget_pc_mon_open_v1';
    let pcMonOpen = (() => {
      const saved = safeGet(STORAGE_PC_MON_OPEN, null);
      if (saved === '1' || saved === '0') return saved === '1';
      return !!(SERVER_STATE && SERVER_STATE.pcMonOpen);
    })();

    function onPcTelemetryToggle(isOpen) {
      pcMonOpen = !!isOpen;
      userTouchedState = true;
      safeSet(STORAGE_PC_MON_OPEN, pcMonOpen ? '1' : '0');
      syncStateToBridge({ pcMonOpen });
      notifyParentResize(true);
    }

    function applyPcTelemetryOpenState() {
      const det = document.getElementById('pc-telemetry-ext');
      if (det) {
        if (det.open !== pcMonOpen) {
          det.open = pcMonOpen;
        }
        hookDetailsSmoothToggle(det);
      }
    }

    function smartPatchPcTelemetry(newHtml) {
      const slot = document.getElementById('pc-telemetry-slot');
      if (!slot || typeof newHtml !== 'string') return;
      const clean = newHtml.replace(/<!--__[A-Z_]+__-->/g, '').trim();
      if (!clean) {
        if (slot.innerHTML.trim() !== '') slot.innerHTML = '';
        return;
      }
      if (slot.dataset.pcSig === clean) return;
      slot.dataset.pcSig = clean;
      const existingDetails = slot.querySelector('#pc-telemetry-ext');
      if (!existingDetails) {
        slot.innerHTML = newHtml;
        applyPcTelemetryOpenState();
        return;
      }
      // Parse incoming HTML off-screen and patch <summary> and .pc-bento-drawer in-place so <details> never closes!
      const tmp = document.createElement('div');
      tmp.innerHTML = clean;
      const nextSum = tmp.querySelector('.pc-hud-strip');
      const nextDrawer = tmp.querySelector('.pc-bento-drawer');
      const curSum = existingDetails.querySelector('.pc-hud-strip');
      const curDrawer = existingDetails.querySelector('.pc-bento-drawer');
      if (nextSum && curSum && curSum.innerHTML !== nextSum.innerHTML) {
        curSum.innerHTML = nextSum.innerHTML;
        curSum.title = nextSum.title || curSum.title;
      }
      if (nextDrawer && curDrawer && curDrawer.innerHTML !== nextDrawer.innerHTML) {
        curDrawer.innerHTML = nextDrawer.innerHTML;
      }
      if (existingDetails.open !== pcMonOpen) {
        existingDetails.open = pcMonOpen;
      }
    }

    async function initLiveBridge() {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 3500);
      try {
        const r = await fetch(`${BRIDGE_URL}/api/status`, { signal: controller.signal });
        const j = await r.json();
        if (j && j.ok) {
          if (Array.isArray(j.accounts) && j.accounts.length > 0) {
            ACCOUNTS.splice(0, ACCOUNTS.length, ...j.accounts);
          }
          if (typeof j.pcTelemetryHtml === 'string') {
            smartPatchPcTelemetry(j.pcTelemetryHtml);
          }
          const va = document.getElementById('view-active');
          const vc = document.getElementById('view-closed');
          const changedActive = smartPatchTree(va, j.activeTreeHtml);
          const changedClosed = smartPatchTree(vc, j.closedTreeHtml);
          // Startup hydration must never overwrite an interaction made while status was in flight.
          if (j.state && !userTouchedState) {
            syncAgentCustomFromBridge(j.state);
          }
          renderQuotas();
          updateLastRefreshBadge(Date.now());
          if (changedActive || changedClosed || !va.dataset.initialized) {
            va.dataset.initialized = '1';
            applyDensityState();
            pinImportedNodes();
            applyTreeUiState();
            switchTab(currentTab, false);
            notifyParentResize();
          }
        }
      } catch (_) {} finally {
        clearTimeout(timeout);
      }
    }

    let lastSentResizeH = 0;
    function notifyHostResize() {
      notifyParentResize(true);
    }

    function notifyParentResize(force = false) {
      try {
        const shell = document.querySelector('.widget-shell');
        if (!shell) return;
        updateCodexPopoverSpace();
        const h = Math.max(360, Math.ceil(shell.getBoundingClientRect().height + 16));
        if (force !== true && Math.abs(h - lastSentResizeH) < 4) return;
        lastSentResizeH = h;
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'RESIZE', height: h }, '*');
        }
      } catch (_) {}
    }

    const ripenStartMap = new Map();
    const evaporatedSubIds = new Set();
    const RIPEN_REMOVE_SEC = 60;

    function formatSecCompact(sec) {
      sec = Math.max(1, Math.floor(sec));
      if (sec >= 3600) {
        const h = Math.floor(sec / 3600);
        const m = Math.floor((sec % 3600) / 60);
        return h + 'h ' + (m < 10 ? '0' : '') + m + 'm';
      }
      if (sec >= 60) {
        const m = Math.floor(sec / 60);
        const s = sec % 60;
        return m + 'm ' + (s < 10 ? '0' : '') + s + 's';
      }
      return sec + 's';
    }

    function tickSubRipening() {
      const now = Date.now();
      const nowSec = now / 1000;
      let changedTree = false;

      // 1. Monotonic ripening for subagent dots and pills
      document.querySelectorAll('#view-active .tree-node.sub-ripening').forEach(node => {
        if (node.classList.contains('hidden') || node.classList.contains('sub-evaporating') || node.dataset.exiting === '1') return;
        if (node.getAttribute('data-sub-running') === '1' || node.dataset.subRunning === '1') return;
        const nid = node.getAttribute('data-node-id') || node.dataset.nodeId || '';
        let startSec = ripenStartMap.get(nid);
        if (startSec === undefined) {
          const rawIdleAge = node.getAttribute('data-idle-age');
          if (rawIdleAge !== null && rawIdleAge !== '') {
            const initialAge = parseFloat(rawIdleAge || '0');
            startSec = nowSec - initialAge;
          } else {
            const doneTs = Number(node.dataset.doneTs || 0);
            if (doneTs > 0 && Math.abs(nowSec - doneTs) <= RIPEN_REMOVE_SEC) {
              startSec = doneTs;
            } else {
              startSec = nowSec;
            }
          }
          ripenStartMap.set(nid, startSec);
        }
        const age = Math.max(0, Math.floor(nowSec - startSec));
        node.dataset.subAge = String(age);
        const dot = node.querySelector(':scope > .agent-row .status-dot');
        const pill = node.querySelector(':scope > .agent-row .ctx-pill:not(.bg-time)');
        if (age >= RIPEN_REMOVE_SEC) {
          if (nid) evaporatedSubIds.add(nid);
          node.dataset.exiting = '1';
          node.classList.add('sub-evaporating', 'node-exit');
          setTimeout(() => {
            node.remove();
            applyTreeFilters();
            notifyParentResize();
          }, 320);
          changedTree = true;
          return;
        }
        if (!pill && !dot) return;
        const rem = Math.max(1, 60 - age);
        let cls = 'age-green';
        let tip = `🟢 SUB 완료 · 초록 단계 (${age}s / 15s · ${rem}s 후 증발)`;
        if (age >= 45) {
          cls = 'age-red';
          tip = `🔴 SUB 소멸 임박 · 빨강 단계 (${age}s / 60s · ${rem}s 후 증발)`;
        } else if (age >= 30) {
          cls = 'age-orange';
          tip = `🟠 SUB 숙성 · 주황 단계 (${age}s / 45s · ${rem}s 후 증발)`;
        } else if (age >= 15) {
          cls = 'age-yellow';
          tip = `🟡 SUB 숙성 · 노랑 단계 (${age}s / 30s · ${rem}s 후 증발)`;
        }
        if (dot) {
          if (!dot.classList.contains(cls)) {
            dot.className = `status-dot ${cls}`;
          }
          dot.title = tip;
        }
        if (pill) {
          if (!pill.classList.contains(cls)) {
            pill.classList.remove('busy', 'running', 'st-busy', 'idle-fresh', 'age-green', 'age-yellow', 'age-orange', 'age-red', 'age-any', 'done');
            pill.classList.add(cls);
          }
          if (pill.dataset.baseTitle === undefined) pill.dataset.baseTitle = pill.title || '';
          pill.title = pill.dataset.baseTitle ? `${tip} · ${pill.dataset.baseTitle}` : tip;
        }
      });

      // 2. Alternate duration (Slot A, 3s) and clock time (Slot B, 3s)
      const showClock = Math.floor(Date.now() / 3000) % 2 === 1;
      document.querySelectorAll('.ctx-time-txt').forEach(el => {
        if (showClock && el.dataset.clockLabel) {
          if (el.textContent !== el.dataset.clockLabel) el.textContent = el.dataset.clockLabel;
        } else {
          if (el.dataset.startTs) {
            const durSec = Math.max(1, Math.floor(nowSec - Number(el.dataset.startTs)));
            const durTxt = formatSecCompact(durSec);
            if (el.textContent !== durTxt) el.textContent = durTxt;
          } else if (el.dataset.durLabel) {
            if (el.textContent !== el.dataset.durLabel) el.textContent = el.dataset.durLabel;
          }
        }
      });

      if (changedTree) notifyParentResize();
    }

    updateLastRefreshBadge(Date.now());
    renderQuotas();
    applyDensityState();
    applyPcTelemetryOpenState();
    pinImportedNodes();
    applyTreeUiState();
    switchTab(currentTab, false);
    notifyParentResize();
    [50, 180, 450].forEach(ms => setTimeout(notifyParentResize, ms));
    window.addEventListener('load', notifyParentResize);
    window.addEventListener('resize', notifyParentResize);
    try {
      const shellEl = document.querySelector('.widget-shell');
      if (shellEl && typeof ResizeObserver !== 'undefined') {
        new ResizeObserver(() => notifyParentResize()).observe(shellEl);
        const barEl = document.getElementById('codex-direct-bar');
        if (barEl) new ResizeObserver(() => notifyParentResize()).observe(barEl);
      }
    } catch (_) {}
    initLiveBridge().finally(notifyParentResize);
    setInterval(tickSubRipening, 1000);
    if (window.parent === window) {
      setInterval(initLiveBridge, 4000);
    }
  </script>
</body>
</html>
